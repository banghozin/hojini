<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>호지니</title>
<meta name="description" content="과목별, 주차별로 나눠 둔 시험 대비 문제은행. 적어 보고 정답을 확인하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ============ 홈 ============ -->
<main class="wrap screen" id="screen-home">

  <header class="top">
    <div class="brand">
      <h1>호지니</h1>
      <span class="tag" id="brandTag">3학년 2학기</span>
    </div>
    <p class="lede">과목을 고르고 주차를 고르면 됩니다. 채점은 하지 않습니다.</p>
  </header>

  <section class="block">
    <h2 class="sec">과목</h2>
    <div class="subjects" id="subjectList"></div>
  </section>

  <section class="block" id="weekBlock">
    <h2 class="sec">주차</h2>
    <div class="chips" id="weekChips"></div>
    <p class="hint" id="poolHint">&nbsp;</p>
  </section>

  <section class="block" id="countBlock">
    <h2 class="sec">문항 수</h2>
    <div class="seg" id="countSeg">
      <button data-c="0" aria-pressed="true">전체</button>
      <button data-c="10" aria-pressed="false">10문항</button>
      <button data-c="20" aria-pressed="false">20문항</button>
    </div>
  </section>

  <div class="actions">
    <button class="btn btn-primary btn-lg" id="btnStart">문제 풀기</button>
    <button class="btn btn-lg" id="btnSheet">문제와 답 한눈에 보기</button>
    <button class="btn btn-lg" id="btnWrong" hidden>오답노트만 풀기</button>
  </div>

  <footer class="foot">
    <span>적은 내용은 저장되지 않고, 새로고침하면 처음부터입니다.</span>
    <span id="wrongFoot" hidden>
      오답노트는 이 기기에만 저장됩니다.
      <button class="linkbtn" id="btnClearWrong">오답노트 비우기</button>
    </span>
  </footer>
</main>

<!-- ============ 풀이 ============ -->
<main class="wrap screen" id="screen-quiz" hidden>

  <div class="quizbar">
    <button class="iconbtn" id="btnQuit" aria-label="그만두기">&#10005;</button>
    <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
    <button class="counter" id="btnGrid" aria-label="문항 목록"><b id="curNo">1</b>/<span id="totalNo">20</span></button>
  </div>

  <div class="gridpanel" id="gridPanel" hidden></div>

  <article class="qwrap">
    <div class="qmeta">
      <span class="qsubject" id="qSubject"></span>
      <span class="qno" id="qWeek">2주차</span>
      <span class="qtag" id="qTag"></span>
      <span class="qtype" id="qType"></span>
    </div>
    <div class="qtext" id="qText"></div>
    <div id="qBody"></div>
    <div class="verdict" id="verdict" hidden></div>
    <button class="notebtn" id="btnNote" type="button" data-on="0">오답노트로 보내기</button>
  </article>

  <div class="navbar">
    <button class="btn" id="btnPrev">이전</button>
    <button class="btn btn-primary" id="btnCheck">정답 확인</button>
    <button class="btn btn-primary" id="btnNext">다음</button>
  </div>
</main>

<!-- ============ 한눈에 보기 ============ -->
<main class="wrap screen" id="screen-sheet" hidden>

  <div class="sheetbar">
    <button class="iconbtn" id="btnSheetQuit" aria-label="홈으로">&#10005;</button>
    <span class="sheetbar-title" id="sheetScope"></span>
    <button class="linkbtn" id="btnPrint">인쇄</button>
  </div>

  <header class="top">
    <div class="brand">
      <h1>문제와 답</h1>
      <span class="tag" id="sheetCount"></span>
    </div>
    <p class="lede">전부 펼쳐 둔 화면입니다. 훑어보거나 인쇄해서 보세요.</p>
    <div class="sheettools">
      <button class="chip" id="btnToggleWhy" type="button" aria-pressed="true">해설 보기</button>
      <button class="chip" id="btnToggleQ" type="button" aria-pressed="true">보기와 오답 보기</button>
    </div>
  </header>

  <div id="sheetList"></div>

  <div class="actions">
    <button class="btn btn-lg" id="btnSheetHome">홈으로</button>
  </div>
</main>

<!-- ============ 다 본 뒤 ============ -->
<main class="wrap screen" id="screen-done" hidden>
  <header class="top">
    <div class="brand">
      <h1>다 봤습니다</h1>
      <span class="tag" id="doneScope"></span>
    </div>
    <p class="lede">헷갈렸던 문항은 한 번 더 돌려 보세요.</p>
  </header>

  <div class="actions">
    <button class="btn btn-primary btn-lg" id="btnAgain">같은 범위 다시</button>
    <button class="btn btn-lg" id="btnHome">홈으로</button>
  </div>
</main>

<script src="data/konseo-w02.js"></script>
<script src="data/konseo-w03.js"></script>
<script src="data/sound-w02.js"></script>
<script src="data/media-w02.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
